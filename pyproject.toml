[project]
name = "jev-leads-lab"
version = "0.1.0"
description = "Laboratorio JEV (TypeSafe) via OpenRouter sobre o CSV de leads da Unidas Livre"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "plotly>=5.22",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevlab"]

[tool.hatch.build.targets.wheel.force-include]
"src/jevlab/core/questions.yaml" = "jevlab/core/questions.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv]
package = true
